<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fluent180 — a 180-day adaptive AI English and career coach.">
<meta name="theme-color" content="#0F6B6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluent180</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: calm coaching console — one column of work, a status strip on top, nav as a quiet segmented rail */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#EBEFF2; --ink:#14212B; --muted:#5A6A77; --line:#DAE1E6;
  --accent:#0F6B6B; --accent-ink:#FFFFFF; --accent-soft:#DFEFEE;
  --gold:#A8680E; --gold-soft:#F7EBD6;
  --good:#1F7A4A; --good-soft:#DDF1E5; --warn:#9A6400; --warn-soft:#F8ECD2;
  --rep:#B9480F; --rep-soft:#F9E3D6; --info:#2A58A6; --info-soft:#DFE7F6; --bad:#B23B3B; --bad-soft:#F7E0E0;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#162027; --sunk:#111A20; --ink:#E5ECF0; --muted:#93A3AF; --line:#25333C;
  --accent:#40B5AC; --accent-ink:#04201E; --accent-soft:#12302E;
  --gold:#E3A74E; --gold-soft:#33271A;
  --good:#52C68D; --good-soft:#15301F; --warn:#E3A74E; --warn-soft:#33271A;
  --rep:#F0894A; --rep-soft:#3A2418; --info:#84A9EA; --info-soft:#1A2640; --bad:#E77C7C; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#162027; --sunk:#111A20; --ink:#E5ECF0; --muted:#93A3AF; --line:#25333C;
  --accent:#40B5AC; --accent-ink:#04201E; --accent-soft:#12302E;
  --gold:#E3A74E; --gold-soft:#33271A;
  --good:#52C68D; --good-soft:#15301F; --warn:#E3A74E; --warn-soft:#33271A;
  --rep:#F0894A; --rep-soft:#3A2418; --info:#84A9EA; --info-soft:#1A2640; --bad:#E77C7C; --bad-soft:#3A1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
img{max-width:100%}[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel{background:var(--sunk);border-radius:10px;padding:14px 16px;min-width:0}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.navwrap{overflow-x:auto;margin-top:10px;scrollbar-width:none}
.nav{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px;width:max-content}
.nav button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;min-height:38px}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pillstat{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.pillstat strong{color:var(--ink);font-family:var(--f-mono);font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--f-body);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.big{font-size:1.05rem;padding:14px 22px;min-height:52px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem;min-width:0}
input[type=text],input[type=number],select,textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .9rem var(--f-body);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
/* options */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:500 1rem var(--f-body);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt:disabled{cursor:default}
/* status */
.tag{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.rep{background:var(--rep-soft);color:var(--rep)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.dec{border-radius:var(--r);padding:18px 20px;border:1px solid var(--line);background:var(--surface);border-left-width:6px}
.dec.ADVANCE{border-left-color:var(--good)} .dec.PRACTICE{border-left-color:var(--warn)} .dec.REPEAT{border-left-color:var(--rep)} .dec.CHANGE{border-left-color:var(--info)}
/* tasks */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tick.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick.skip{border-style:dashed}
/* scores */
.score{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.bigscore{font-family:var(--f-display);font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,160px) 1fr 44px;gap:10px;align-items:center;font-size:.93rem}
.bar .track{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .fill.lo{background:var(--rep)} .bar .fill.mid{background:var(--warn)}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .track{flex:1;height:10px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.lvl .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
/* feedback */
.fb-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.corr{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--sunk)}
.corr .from{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.corr .to{font-weight:600}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.ai{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent-soft);align-self:flex-end;border-bottom-right-radius:4px}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.93rem}
.banner.info{background:var(--info-soft)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.loading{display:flex;gap:12px;align-items:center;color:var(--muted);padding:24px 0}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th,table.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.kbd{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);padding:1px 6px;border-radius:5px}
.phase{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.phase div{height:6px;border-radius:4px;background:var(--sunk)}
.phase div.on{background:var(--accent)}
.phase div.cur{background:var(--gold)}
.ach{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid var(--line)}
.ach.off{opacity:.45}
.ach .medal{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
@media (max-width:520px){h1{font-size:1.45rem}.card{padding:16px}.bar{grid-template-columns:96px 1fr 38px}.bigscore{font-size:2.1rem}}
</style>

</head>

<script>
"use strict";
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const R=v=>v==null?null:Math.round(v);
const uid=()=>Math.random().toString(36).slice(2,10);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const words=s=>(String(s||'').trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= constants ================= */
const SK=['grammar','vocabulary','reading','listening','speaking','writing','professional'];
const SKN={grammar:'Grammar',vocabulary:'Vocabulary',reading:'Reading',listening:'Listening',speaking:'Speaking',writing:'Writing',professional:'Professional English',interview:'Interview readiness',pronunciation:'Pronunciation'};
const WEIGHTS={speaking:.24,writing:.18,grammar:.16,vocabulary:.15,listening:.15,reading:.05,professional:.07};
const TH={advance:85,practice:70,repeat:55};

const METHODS=[
 {id:'drill',name:'Focused practice',desc:'clear rule, then controlled practice items'},

];

const PH=[
 {n:'Foundation',target:'B1−',mode:'English with native-language help',goal:'Accurate basic tenses; everyday situations',topics:[
  ['intro','Introducing yourself','present simple of "be" and "have"'],['routine','Daily routine','present simple with adverbs of frequency'],['family','Family and people','possessives and "have got"'],['home','Home and neighbourhood','there is / there are; prepositions of place'],['shopping','Shopping','countable and uncountable nouns; some/any; how much/many'],['restaurant','Restaurants and cafés','polite requests with "would like" and "could I"'],['transport','Transport and getting around','present continuous for now and for plans'],['directions','Asking for directions','imperatives and prepositions of movement'],['appoint','Making appointments','time prepositions in/on/at; asking for availability'],['questions','Asking good questions','question formation with do/does/did'],['past','Talking about past experiences','past simple, regular and irregular verbs'],['weekend','Telling what happened','past simple and time sequencers'],['future','Future plans','going to and will'],['people','Describing people','adjectives and word order'],['places','Describing places','comparatives and superlatives'],['opinions','Giving simple opinions','I think / In my opinion + because']]},
 {n:'Fluency & Conversation',target:'B1',mode:'Mostly English',goal:'Longer answers, less hesitation, natural conversation',topics:[
  ['reasons','Opinions with reasons','because / so / that\'s why'],['experience','Life experiences','present perfect with ever/never'],['travel','Travel stories','past continuous vs past simple'],['problems','Problems and advice','should / could / why don\'t you'],['plans2','Plans and arrangements','present continuous vs going to vs will'],['prefer','Preferences','prefer / would rather / I\'d prefer to'],['smalltalk','Small talk','follow-up questions and short answers'],['social','Social conversations','showing interest: really? that sounds…'],['explain','Explaining a situation','although / however / because of'],['agree','Agreeing and disagreeing','polite disagreement phrases'],['story','Telling a longer story','sequencing: first, after that, in the end'],['suggest','Making suggestions','let\'s / how about / we could']]},
 {n:'Workplace English',target:'B1+',mode:'English by default',goal:'Office conversations, calls, requests, updates',topics:[
  ['workvocab','Workplace vocabulary','collocations: make a decision, meet a deadline'],['office','Office conversations','present simple vs continuous for work'],['meetings','Meetings','phrases to open, contribute and summarise'],['phone','Telephone calls','polite phone phrases; will for offers'],['requests','Making requests','could you / would you mind + -ing'],['followup','Following up','present perfect: have you had a chance to'],['updates','Giving updates','present perfect and past simple together'],['clarify','Asking for clarification','indirect questions: could you tell me what'],['explainprob','Explaining problems','past continuous and because/so'],['solutions','Offering solutions','I suggest / we could / one option is'],['manager','Talking to your manager','polite modals: might, would'],['customers','Talking to customers','polite forms and apologising']]},
 {n:'Professional Communication',target:'B1+',mode:'English only',goal:'Emails and reports with clear structure',topics:[
  ['emailstruct','Email structure','greeting, purpose, request, closing'],['emailreq','Request emails','polite requests and deadlines'],['emailfollow','Follow-up emails','present perfect; gentle reminders'],['emailapol','Apology emails','past simple + future commitment'],['emailupdate','Update emails','present perfect and next steps'],['emailclar','Clarification emails','indirect questions'],['dailyrep','Daily reports','past simple, concise bullet style'],['weeklyrep','Weekly reports','Situation, Facts, Action, Result, Next step'],['incident','Incident reports','past continuous and passive voice'],['minutes','Meeting summaries','reported speech: she said that'],['progress','Progress reports','present perfect continuous'],['projupdate','Project updates','future forms for next steps']]},
 {n:'Career & Interviews',target:'B2−',mode:'English only',goal:'STAR answers, presentations, role questions',topics:[
  ['tmay','Tell me about yourself','past-to-present-to-future structure'],['experience2','Describing your experience','present perfect for achievements'],['whyrole','Why this position','want to / would like to / I\'m interested in'],['strengths','Strengths with evidence','for example / as a result'],['growth','Areas you are improving','I\'m working on… / I have started'],['star1','Difficult situation (STAR)','past simple + past continuous in stories'],['star2','Solving a problem (STAR)','sequencers and result phrases'],['conflict','Conflict with a colleague','reported speech and neutral language'],['mistake','A mistake you made','past simple + what I learned'],['success','A successful project','passive voice for achievements'],['askq','Questions for the interviewer','indirect questions'],['present','Short presentation about your job','signposting: first, next, to sum up']]},
 {n:'Real-World Simulation',target:'B2',mode:'English only',goal:'Handle real office and customer situations',topics:[

];

/* ========== placement static bank (bands weight harder items more) ========== */
const PG=[
 {b:'A2',p:'past_simple',q:'Yesterday I ___ to the bank.',o:['go','went','gone','going'],a:'went'},
 {b:'A2',p:'present_simple',q:'She ___ in an office near the Marina.',o:['work','works','working','is work'],a:'works'},
 {b:'A2',p:'articles',q:'I\'m looking for ___ apartment with two bedrooms.',o:['a','an','the','(no word)'],a:'an'},

 {b:'A2',p:'countable_uncountable',q:'How ___ money do you need?',o:['many','much','lot','few'],a:'much'},
 {b:'B1',p:'present_perfect',q:'I ___ in Dubai since 2023.',o:['live','lived','have lived','am living'],a:'have lived'},
 {b:'B1',p:'past_continuous',q:'I ___ dinner when my manager called.',o:['cooked','was cooking','have cooked','cook'],a:'was cooking'},
 {b:'B1',p:'comparatives',q:'This job is ___ than my last one.',o:['more easy','easier','most easy','easiest'],a:'easier'},
 {b:'B1',p:'future_forms',q:'Look at those clouds. It ___ rain.',o:['will','is going to','going','shall to'],a:'is going to'},
 {b:'B1',p:'modals',q:'You ___ wear a suit; smart casual is fine.',o:['mustn\'t','don\'t have to','can\'t','shouldn\'t to'],a:'don\'t have to'},
 {b:'B1',p:'first_conditional',q:'If the client ___ tomorrow, I will send the contract.',o:['agrees','will agree','agreed','agree'],a:'agrees'},
 {b:'B1',p:'passive',q:'The report ___ by the finance team every Friday.',o:['prepares','is prepared','is preparing','prepared'],a:'is prepared'},
 {b:'B1',p:'gerund_infinitive',q:'I\'m interested in ___ for your company.',o:['work','to work','working','worked'],a:'working'},
 {b:'B1',p:'word_order',q:'Which sentence is correct?',o:['I always am late on Mondays.','I am always late on Mondays.','Always I am late on Mondays.','I am late always on Mondays.'],a:'I am always late on Mondays.'},
 {b:'B2',p:'second_conditional',q:'If I ___ more experience, I would apply for the manager role.',o:['have','had','would have','having'],a:'had'},
 {b:'B2',p:'reported_speech',q:'She said she ___ the files the day before.',o:['sends','has sent','had sent','will send'],a:'had sent'},
 {b:'B2',p:'present_perfect_continuous',q:'We ___ on this project for three months, and it\'s nearly finished.',o:['work','are working','have been working','worked'],a:'have been working'},
 {b:'B2',p:'relative_clauses',q:'The colleague ___ helped me is from Kerala.',o:['which','who','whom','whose'],a:'who'},
 {b:'B2',p:'passive_modal',q:'The invoice ___ by Friday at the latest.',o:['must pay','must be paid','must paid','must be paying'],a:'must be paid'},
 {b:'B2',p:'dependent_prepositions',q:'I\'m responsible ___ managing the front desk.',o:['of','for','to','with'],a:'for'}

  if(json)merged[merged.length-1].content+='\n\nReply with only the JSON value, no other text.';

function recorder(boxId,onUpdate){

      r.onend=()=>{if(st.active){st.dur+=(Date.now()-st.started)/1000;st.active=false;onUpdate(st)}};
      r.start();st.rec=r;st.active=true;st.started=Date.now();st.mode='spoken';onUpdate(st);return true;

  if(window.claude&&typeof window.claude.use==='function'){
    const [db,user,sample,dl]=await Promise.all([claude.use('db').catch(()=>null),claude.use('user').catch(()=>null),claude.use('sample').catch(()=>null),claude.use('downloads').catch(()=>null)]);
    DB=db;USER=user;SAMPLE=sample;DL=dl;
    if(USER){try{UID=await USER.id()}catch(e){UID=null}}
  }
  if(!SAMPLE)AIOK=!!getKey();
  S=await load()||blank();
  S=Object.assign(blank(),S);
  const t=todayStr();
  RT.welcomeBack=S.lastActive&&daysBetween(S.lastActive,t)>=2;
  S.lastActive=t;
  ROUTE=!S.profile?'onboard':!S.placement?'placement':'home';
  if(location.hash==='#coach')ROUTE='coach';
  render();
}

/* ================= shell ================= */
const NAV=[['home','Today'],['progress','Progress'],['errors','Error bank'],['interview','Interview'],['work','Work English'],['coach','Coach view'],['settings','Settings']];
function go(r){ROUTE=r;RT.task=null;if(TTS)speechSynthesis.cancel();render();window.scrollTo(0,0)}
function shell(inner){
  const onboarding=ROUTE==='onboard'||ROUTE==='placement'&&!S.placement;
  const lvl=band(overallLevel());
  return `<header class="top"><div class="row between"><div class="brand">Fluent<b>180</b></div>

   ${onboarding?'':`<div class="navwrap"><nav class="nav" aria-label="Main">${NAV.map(([k,l])=>`<button data-go="${k}" ${ROUTE===k||(ROUTE==='task'&&k==='home')||(ROUTE==='dayreport'&&k==='home')?'aria-current="page"':''}>${l}</button>`).join('')}</nav></div>`}
  </header>

function render(){
  const v={onboard:vOnboard,placement:vPlacement,journey:vJourney,home:vHome,task:vTask,dayreport:vDayReport,progress:vProgress,errors:vErrors,interview:vInterview,work:vWork,settings:vSettings,coach:vCoach}[ROUTE]||vHome;
  $('#app').innerHTML=shell(v());
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  (AFTER[ROUTE]||(()=>{}))();
}

     <div class="row"><button class="btn primary" id="ck-next">Continue</button></div></div>`;
  }else if(C.step==='listening'){
    const L=C.items.listening;

     <div class="row"><button class="btn" id="ck-play" ${C.plays>=2?'disabled':''}>Play the call (${2-C.plays} left)</button></div>
     ${L.qs.map((q,qi)=>`<div class="stack-s"><h3>${qi+1}. ${esc(q.q)}</h3><div class="opts" data-q="${qi}">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
     <div class="row"><button class="btn primary" id="ck-next">Continue</button></div></div>`;
  }else if(C.step==='writing'){
    const p=C.items.writing;
    body=`<div class="card stack"><span class="eyebrow">Writing</span><h3>${esc(p)}</h3>
     <textarea id="ck-w" placeholder="Write 60–120 words">${esc(C.wdraft||'')}</textarea>
     <div class="row between"><span class="small muted" id="ck-wc">0 words</span>

function speakBox(p){
  const can=!!SRC&&!SR_BLOCKED;
  return `<div class="stack-s">
   ${can?`<div class="row"><button class="btn" id="${p}-rec">● Start speaking</button><span class="small muted" id="${p}-recst">Uses your browser's speech recognition.</span></div>`:''}
   <textarea id="${p}-txt" style="min-height:130px" placeholder="${can?'Your words appear here as you speak. You can also type.':'Type exactly what you would say out loud, the way you would say it.'}"></textarea>
   ${can?'':`<p class="small muted">Microphone isn't available here, so this is typed speaking practice. Grammar, vocabulary and structure are scored; fluency and pronunciation are not measured.</p>`}
  </div>`;
}
function wireSpeak(p,holder){
  const st=recorder(p,s=>{const b=$('#'+p+'-rec'),t=$('#'+p+'-txt'),l=$('#'+p+'-recst');
    if(t&&s.mode==='spoken')t.value=s.text;
    if(b)b.textContent=s.active?'■ Stop':'● Start speaking';
    if(l)l.textContent=s.blocked?'Microphone is blocked here. Type your answer instead; fluency will not be scored.':s.active?'Listening…':'Stopped. Edit the text if a word was misheard.';
    if(s.blocked&&b)b.disabled=true;});
  holder.rec=st;
  const b=$('#'+p+'-rec');if(b)b.onclick=()=>{if(st.active)st.stop();else st.start()};
  const t=$('#'+p+'-txt');if(t)t.oninput=()=>{st.text=t.value};
  if(t&&holder.draft)t.value=holder.draft;
  return st;
}
async function genCheckItems(mode){
  const lvl=mode==='final'?'A2 to C1':'A2 to B2';
  const r=await ai(`${ctx()}\nCreate a NEW parallel-form English level check (${lvl}), different from standard textbook items. Return JSON:
{"grammar":[12 items {"b":"A2|B1|B2","p":"snake_case grammar point","q":"question or sentence with ___","o":[4 options],"a":"exact correct option"}] (4 A2, 5 B1, 3 B2),
"vocab":[8 items same shape, "p" one of everyday_vocab, workplace_vocab, collocations, phrasal_verbs, register, professional_vocab],
"reading":{"text":"a 120-160 word workplace email or notice","qs":[4 {"q","o":[4],"a"}]},
"listening":{"lines":[6-8 {"s":"A|B","t":"line"}] (a realistic workplace phone call or meeting),"qs":[3 {"q","o":[4],"a"}]},
"writing":"one professional email writing task, 60-120 words, related to the learner's target job",
"speaking":["2 open speaking questions: one about their work experience, one about a problem they solved"]}
Every "a" must exactly equal one of its "o". ${STYLE}`,{tier:'default'});
  const ok=x=>x&&Array.isArray(x.o)&&x.o.length===4&&x.o.includes(x.a);
  if(!r||!Array.isArray(r.grammar)||r.grammar.filter(ok).length<8)throw{code:'invalid_json'};
  return{grammar:r.grammar.filter(ok),vocab:(r.vocab||[]).filter(ok).slice(0,8),reading:r.reading&&r.reading.qs&&r.reading.qs.every(ok)?r.reading:PREAD,listening:r.listening&&r.listening.qs&&r.listening.qs.every(ok)?{lines:r.listening.lines,qs:r.listening.qs}:PLISTEN,writing:r.writing||'Write an email to a new manager introducing yourself and asking about your first week.',speaking:(r.speaking||[]).slice(0,2).length===2?r.speaking.slice(0,2):['Tell me about your work experience so far.','Describe a problem you solved. What did you do?']};
}
function defaultItems(){return{grammar:PG,vocab:PV,reading:PREAD,listening:PLISTEN,writing:'Write a short email (60–120 words) to your new manager. Introduce yourself and ask two questions about your first day.',speaking:['Introduce yourself. Tell me about your background and your daily routine.','Tell me about your previous work. Describe one difficult situation and what you did.']}}
AFTER.placement=()=>{
  const C=RT.check;
  const next=step=>{C.step=step;C.i=0;render();window.scrollTo(0,0)};
  const b=$('#ck-go');if(b)b.onclick=async()=>{
    if(C.mode==='placement'||!AIOK){C.items=defaultItems();next('grammar');return}
    C.step='loading';render();
    try{C.items=await genCheckItems(C.mode)}catch(e){C.items=defaultItems();C.note='New questions could not be generated, so the original test was used.'}
    next('grammar');
  };
  if(C.step==='grammar'||C.step==='vocab'){
    const bank=C.step==='grammar'?C.items.grammar:C.items.vocab;
    document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      const it=bank[C.i];C.ans[C.step].push({p:it.p,b:it.b,ok:it.o[+o.dataset.k]===it.a,chosen:it.o[+o.dataset.k],q:it.q,a:it.a});
      if(C.i+1<bank.length){C.i++;render()}else next(C.step==='grammar'?'vocab':'reading');
    });
  }
  if(C.step==='reading'||C.step==='listening'){
    const key=C.step,src=C.items[key];
    document.querySelectorAll('.opts[data-q]').forEach(g=>g.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');C.ans[key][+g.dataset.q]=+o.dataset.k}));
    const pl=$('#ck-play');if(pl)pl.onclick=()=>{C.plays++;pl.disabled=true;pl.textContent='Playing…';sayLines(src.lines,phaseOf(S.day)<1?0.9:1,()=>{pl.disabled=C.plays>=2;pl.textContent=`Play the call (${2-C.plays} left)`})};
    $('#ck-next').onclick=()=>{
      if(src.qs.some((q,i)=>C.ans[key][i]==null)){alertInline('#ck-next','Answer every question first.');return}
      if(TTS)speechSynthesis.cancel();
      next(key==='reading'?(TTS?'listening':'writing'):'writing');
    };
  }
  if(C.step==='writing'){
    const t=$('#ck-w'),wc=$('#ck-wc');const up=()=>{wc.textContent=words(t.value)+' words';C.wdraft=t.value};t.oninput=up;up();
    $('#ck-wskip').onclick=()=>{C.writing=null;next('speaking')};
    $('#ck-wnext').onclick=()=>{if(words(t.value)<25){alertInline('#ck-wnext','Write at least 25 words, or choose Skip.');return}C.writing=t.value;next('speaking')};
  }
  if(C.step==='speaking'){
    const holder={};wireSpeak('ck',holder);
    const done=()=>{if(C.spIdx+1<C.items.speaking.length){C.spIdx++;render()}else finishCheck()};
    $('#ck-sskip').onclick=()=>{holder.rec&&holder.rec.stop();C.speaking.push(null);done()};
    $('#ck-snext').onclick=()=>{holder.rec&&holder.rec.stop();const txt=$('#ck-txt').value.trim();
      if(words(txt)<15){alertInline('#ck-snext','Give a longer answer (at least 15 words), or choose Skip.');return}
      C.speaking.push({q:C.items.speaking[C.spIdx],text:txt,m:deliveryMetrics(txt,holder.rec.dur,holder.rec.mode)});done()};
  }
  if(C.step==='result'){
    const b2=$('#ck-journey');if(b2)b2.onclick=()=>go(C.mode==='placement'?'journey':'home');
  }
};
function alertInline(sel,msg){const b=$(sel);if(!b)return;let n=b.parentElement.querySelector('.inline-msg');if(!n){n=document.createElement('span');n.className='inline-msg small';n.style.color='var(--bad)';b.parentElement.appendChild(n)}n.textContent=msg}
function weightedPct(arr){const W={A2:1,B1:1.3,B2:1.6,C1:1.8};let t=0,g=0;for(const a of arr){const w=W[a.b]||1.2;t+=w;if(a.ok)g+=w}return t?g/t*100:null}
async function finishCheck(){
  const C=RT.check;C.step='scoring';render();
  const res={grammar:weightedPct(C.ans.grammar),vocabulary:weightedPct(C.ans.vocab),
    reading:C.items.reading.qs.length?C.items.reading.qs.filter((q,i)=>q.o[C.ans.reading[i]]===q.a).length/C.items.reading.qs.length*100:null,
    listening:TTS&&C.items.listening?C.items.listening.qs.filter((q,i)=>q.o[C.ans.listening[i]]===q.a).length/C.items.listening.qs.length*100:null,
    writing:null,speaking:null,professional:null};
  const errs=[];let notes=[];
  C.ans.grammar.concat(C.ans.vocab).filter(a=>!a.ok).forEach(a=>{if(a.q.includes('___'))errs.push({original:a.q.replace('___',a.chosen),corrected:a.q.replace('___',a.a),explanation:'Placement test item.',pattern:a.p,category:a.p})});
  if(AIOK){
    const jobs=[];
    if(C.writing)jobs.push(evalWriting(C.items.writing,C.writing,true).then(r=>{res.writing=r.overall;res.professional=avg([r.scores.professionalism,r.scores.tone]);(r.corrections||[]).forEach(c=>errs.push(c));C.wEval=r}).catch(e=>notes.push('Writing could not be scored: '+aiErr(e))));
    const sp=C.speaking.filter(Boolean);
    if(sp.length)jobs.push(Promise.all(sp.map(s=>evalSpeaking(s.q,s.text,s.m,true))).then(rs=>{res.speaking=avg(rs.map(r=>r.overall));rs.forEach(r=>(r.errors||[]).forEach(c=>errs.push(c)));C.sEval=rs}).catch(e=>notes.push('Speaking could not be scored: '+aiErr(e))));
    await Promise.all(jobs);
  }
  // professional fallback from register vocab items
  if(res.professional==null){const reg=C.ans.vocab.filter(a=>/register|professional/.test(a.p));if(reg.length)res.professional=weightedPct(reg)*0.9}
  const errsKept=errs.slice(0,12);
  const record={kind:C.mode,day:S.day,date:todayStr(),per:Object.fromEntries(Object.entries(res).map(([k,v])=>[k,R(v)])),notes};
  if(C.mode==='placement'){
    S.placement=record;S.skills={};
    for(const k in res)if(res[k]!=null){S.skills[k]={ewma:res[k],n:1,last:res[k],hist:[{d:0,v:Math.round(res[k])}]}}
    errsKept.forEach(e=>addError(e,e.skill||'grammar'));
    // seed topic knowledge
    C.ans.grammar.forEach(a=>{const t=topicState('pl_'+a.p);t.name=PATTERN_LABEL(a.p);pushCtx(t.rec,a.ok?100:0)});
  }else{
    errsKept.forEach(e=>addError(e,'grammar'));
  }
  const lv=levelFrom(res);record.overall=R(lv);record.level=band(lv);record.weak=topWeaknesses();
  S.assessments.push(record);C.result=record;C.step='result';
  if(C.mode!=='placement'&&S.today){const t=S.today.tasks.find(x=>x.type==='check');if(t){t.status='done';t.score=record.overall;t.skills=Object.fromEntries(Object.entries(record.per).filter(([k,v])=>v!=null));t.ended=Date.now()}}
  save();pushCoach();render();
}
function checkResult(){
  const C=RT.check,r=C.result,base=S.placement;
  const rows=SK.map(k=>{const v=r.per[k],b=base&&base.per[k];
    return `<tr><td>${SKN[k]}</td><td class="mono">${v==null?'<span class="muted">Not measured</span>':v}</td><td>${v==null?'—':band(v)}</td>${C.mode!=='placement'?`<td class="mono">${b==null?'—':b+' → '+(v??'—')}</td>`:''}</tr>`}).join('');

     ${t.status==='todo'?`<button class="btn ${next&&next.id===t.id?'primary':''}" data-task="${t.id}">${t.started?'Continue':'Start'}</button>`:t.status==='done'?`<span class="tag ${t.score>=85?'good':t.score>=70?'warn':t.score>=55?'rep':'info'}">${t.score>=85?'Strong':t.score>=70?'Good':t.score>=55?'Needs work':'Retry later'}</span>`:'<span></span>'}</div>`).join('')}</div>
   ${next?'':`<div class="stack-s"><hr class="hr"><p class="small muted">${canFinish?'All tasks are finished. Complete the day to get your score and tomorrow\'s plan.':'Complete at least 70% of tasks to finish the day.'}</p>

      box.innerHTML=`<div class="panel stack-s"><span class="eyebrow">${esc(S.profile.lang)}</span><p style="white-space:pre-line">${esc(txt)}</p><div><button class="btn ghost" id="ex-close">Back to English</button></div></div>`;$('#ex-close').onclick=()=>{box.hidden=true}}

function body(html){const b=$('#tk-body');if(b)b.innerHTML=html}
function taskTopic(t){return t.topicOverride||(S.today?S.today.topic:currentTopic())}
function taskMethod(){const m=S.today?METHODS.find(x=>x.id===S.today.method):METHODS[0];return m||METHODS[0]}
async function ensureContent(t,gen){
  if(t.content)return t.content;
  try{t.content=await gen();save();return t.content}
  catch(e){body(`<div class="card stack"><div class="banner">${esc(aiErr(e))}</div><div class="row"><button class="btn primary" id="tk-retry">Try again</button></div></div>`);const r=$('#tk-retry');if(r)r.onclick=()=>{body('<div class="card loading"><span class="spinner"></span> Preparing your task…</div>');AFTER.task()};return null}
}
function completeTask(t,score,skills,extra){
  t.status='done';t.score=Math.round(score);t.skills=skills;t.ended=Date.now();Object.assign(t,extra||{});
  const min=Math.min(60,Math.max(1,Math.round((t.ended-(t.started||t.ended))/60000)));t.minutes=min;
  S.stats.minutes+=min;
  if(t.type==='speaking'||t.type==='conversation'){S.stats.speakingMin+=min}
  if(t.adhoc){for(const k in skills)if(skills[k]!=null)updateSkill(k,skills[k],S.day)}
  save();
}
function doneCard(t,msg){return `<div class="card stack"><div class="row between"><h2>Task complete</h2><span class="score" style="font-size:1.4rem">${t.score}/100</span></div>${msg||''}
 <div class="row"><button class="btn primary big" id="tk-home">${t.adhoc?'Done':'Back to today\'s plan'}</button></div></div>`}
function wireDone(t){const b=$('#tk-home');if(b)b.onclick=()=>go(t.adhoc?(t.backTo||'home'):'home')}

/* ---- vocabulary ---- */
async function runVocab(t){
  const tp=taskTopic(t);
  const c=await ensureContent(t,async()=>{
    const known=S.vocab.slice(-80).map(v=>v.word).join(', ');
    const r=await ai(`${ctx()}\nTeach 6 useful English words or phrases for the topic "${tp.name}" at the learner's level (${PH[tp.phase||0].target}). Prefer words they will use at work in their target job. Do not repeat these known items: ${known||'none'}.
JSON: {"words":[{"word":"","meaning":"simple English definition","example":"natural example sentence","register":"neutral|formal|informal"}],"quiz":[6 items {"q":"sentence with ___ where one taught word fits","o":[4 options drawn from the taught words],"a":"exact correct option"}]} ${STYLE}`);
    if(!r||!Array.isArray(r.words)||!Array.isArray(r.quiz))throw{code:'invalid_json'};
    r.quiz=r.quiz.filter(q=>q.o&&q.o.includes(q.a));return r;
  });
  if(!c)return;
  RT.v=RT.v&&RT.v.id===t.id?RT.v:{id:t.id,stage:'learn',i:0,ok:0};
  const V=RT.v;
  if(V.stage==='learn'){
    body(`<div class="card stack"><p class="muted">Read each word and example. ${TTS?'Tap Listen to hear it.':''} Then take the quiz.</p>
      ${c.words.map((w,i)=>`<div class="panel stack-s"><div class="row between"><strong style="font-size:1.1rem">${esc(w.word)}</strong><div class="row"><span class="tag ${w.register==='formal'?'info':w.register==='informal'?'warn':''}">${esc(w.register||'neutral')}</span>${TTS?`<button class="btn ghost" data-say="${i}">Listen</button>`:''}</div></div><span>${esc(w.meaning)}</span><em class="muted">${esc(w.example)}</em></div>`).join('')}
      <div class="row"><button class="btn primary big" id="vq-start">Start the quiz</button></div></div>`);
    document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const w=c.words[+b.dataset.say];say(w.word+'. '+w.example,{rate:.9})});
    $('#vq-start').onclick=()=>{V.stage='quiz';runVocab(t)};return;
  }
  if(V.stage==='quiz'){
    const q=c.quiz[V.i];
    body(`<div class="card stack"><span class="eyebrow">Question ${V.i+1} of ${c.quiz.length}</span><h2 style="font-family:var(--f-body);font-size:1.2rem">${esc(q.q)}</h2>
     <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="vq-fb"></div></div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=q.o[+b.dataset.k]===q.a;if(ok)V.ok++;
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.o[+x.dataset.k]===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
      $('#vq-fb').innerHTML=`<div class="row between" style="margin-top:8px"><span class="small ${ok?'':'muted'}">${ok?'Correct.':'You\'re close. The best answer is "'+esc(q.a)+'".'}</span><button class="btn primary" id="vq-next">${V.i+1<c.quiz.length?'Next':'See result'}</button></div>`;
      $('#vq-next').onclick=()=>{if(V.i+1<c.quiz.length){V.i++;runVocab(t)}else{
        const sc=V.ok/c.quiz.length*100;
        c.words.forEach(w=>{if(!S.vocab.find(v=>norm(v.word)===norm(w.word))){S.vocab.push({word:w.word,meaning:w.meaning,example:w.example,register:w.register,ease:2.3,reps:0,due:S.day+1,added:S.day});S.stats.words++}});
        completeTask(t,sc,{vocabulary:sc});V.stage='done';runVocab(t)}};
    });return;
  }
  body(doneCard(t,`<p>${V.ok} of ${c.quiz.length} correct. The ${c.words.length} words were added to your review schedule — you'll see them again tomorrow, then after 2, 4, 7, 14 and 30 learning days.</p>`));wireDone(t);
}

/* ---- grammar ---- */
async function runGrammar(t){
  const tp=taskTopic(t),m=taskMethod();
  const c=await ensureContent(t,async()=>{
    const errs=S.errors.filter(e=>e.status!=='resolved').sort((a,b)=>b.count-a.count).slice(0,3).map(e=>`${e.original} → ${e.corrected}`).join('; ');
    const r=await ai(`${ctx()}\nCreate a grammar practice set. Topic: "${tp.name}". Target structure: ${tp.grammar}. Teaching method: ${m.name} — ${m.desc}. Where it fits naturally, include 1-2 items that practise the learner's recurring mistakes (${errs||'none'}). Contexts: everyday life${(tp.phase||0)>=2?' and workplace situations related to the target job':''}.
JSON: {"intro":"3-4 sentence explanation of the structure with two short examples, written for this method","items":[8 items, mix: 4 {"type":"mcq","q":"","o":[4],"a":"exact option","explain":"one sentence","pattern":"snake_case grammar point"}, 2 {"type":"gap","q":"sentence with one ___","answers":["accepted answer",...],"explain":"","pattern":""}, 2 {"type":"fix","q":"sentence with exactly one error","a":"fully corrected sentence","explain":"","pattern":""}]} ${STYLE}`);
    if(!r||!Array.isArray(r.items)||r.items.length<5)throw{code:'invalid_json'};
    r.items=r.items.filter(i=>i.type==='mcq'?i.o&&i.o.includes(i.a):i.type==='gap'?Array.isArray(i.answers)&&i.answers.length:i.type==='fix'?!!i.a:false);return r;
  });
  if(!c)return;
  RT.g=RT.g&&RT.g.id===t.id?RT.g:{id:t.id,stage:'intro',i:0,res:[]};
  const G=RT.g;
  if(G.stage==='intro'){
    body(`<div class="card stack"><span class="eyebrow">${esc(m.name)}</span><div class="panel" style="white-space:pre-line">${esc(c.intro)}</div><div class="row"><button class="btn primary big" id="gr-go">Start ${c.items.length} questions</button></div></div>`);
    $('#gr-go').onclick=()=>{G.stage='q';runGrammar(t)};return;
  }
  if(G.stage==='q'){
    const it=c.items[G.i];
    const head=`<span class="eyebrow">Question ${G.i+1} of ${c.items.length} · ${it.type==='mcq'?'Choose':it.type==='gap'?'Fill the gap':'Correct the sentence'}</span>`;
    if(it.type==='mcq'){
      body(`<div class="card stack">${head}<h2 style="font-family:var(--f-body);font-size:1.2rem">${esc(it.q)}</h2><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="gr-fb"></div></div>`);
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ch=it.o[+b.dataset.k],ok=ch===it.a;
        document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(it.o[+x.dataset.k]===it.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
        grFeedback(t,it,ok,it.q.includes('___')?it.q.replace('___',ch):ch,it.q.includes('___')?it.q.replace('___',it.a):it.a)});
    }else{
      body(`<div class="card stack">${head}<h2 style="font-family:var(--f-body);font-size:1.2rem">${esc(it.q)}</h2>
       <input type="text" id="gr-in" autocomplete="off" placeholder="${it.type==='gap'?'Type the missing word(s)':'Type the corrected sentence'}">
       <div class="row"><button class="btn primary" id="gr-check">Check</button></div><div id="gr-fb"></div></div>`);
      const inp=$('#gr-in');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')$('#gr-check').click()};
      $('#gr-check').onclick=async()=>{const v=inp.value.trim();if(!v)return;$('#gr-check').disabled=true;inp.disabled=true;
        if(it.type==='gap'){const ok=it.answers.some(a=>norm(a)===norm(v));grFeedback(t,it,ok,it.q.replace('___',v),it.q.replace('___',it.answers[0]))}
        else{let ok=norm(v)===norm(it.a);
          if(!ok&&AIOK){$('#gr-fb').innerHTML='<div class="loading small"><span class="spinner"></span> Checking…</div>';
            try{const j=await ai(`A learner corrected this sentence. Original with an error: "${it.q}". Model correction: "${it.a}". Learner's version: "${v}". Is the learner's version correct, natural English that fixes the error (small wording differences are fine)? JSON {"correct":true|false,"note":"one short sentence"}`,{tier:'quick'});ok=!!(j&&j.correct);if(j&&j.note)it.note=j.note}catch(e){}}
          grFeedback(t,it,ok,v,it.a)}};
    }return;
  }
  const sc=G.res.filter(Boolean).length/G.res.length*100;
  body(doneCard(t,`<p>${G.res.filter(Boolean).length} of ${G.res.length} correct.${sc<70?' The items you missed were saved to your error bank and will come back in review.':''}</p>`));wireDone(t);
}
function grFeedback(t,it,ok,learner,correct){
  const G=RT.g,c=t.content;G.res.push(ok);
  if(!ok)addError({original:learner,corrected:correct,explanation:it.explain,pattern:it.pattern||'grammar'},'grammar');
  $('#gr-fb').innerHTML=`<div class="stack-s" style="margin-top:6px">${ok?'<strong style="color:var(--good)">Correct.</strong>':`<div class="corr"><span class="from">${esc(learner)}</span><span class="to">${esc(correct)}</span></div>`}
   <span class="small muted">${esc(it.note||it.explain||'')}</span><div class="row"><button class="btn primary" id="gr-next">${G.i+1<c.items.length?'Next':'See result'}</button></div></div>`;
  $('#gr-next').onclick=()=>{if(G.i+1<c.items.length){G.i++;runGrammar(t)}else{
    const sc=G.res.filter(Boolean).length/G.res.length*100;
    const mcq=c.items.map((x,i)=>[x,G.res[i]]);const rec=mcq.filter(x=>x[0].type==='mcq'),ctl=mcq.filter(x=>x[0].type!=='mcq');
    const tp=taskTopic(t);if(!t.adhoc&&!tp.weekly){const ts=topicState(tp.id);if(rec.length)pushCtx(ts.rec,rec.filter(x=>x[1]).length/rec.length*100);if(ctl.length)pushCtx(ts.ctl,ctl.filter(x=>x[1]).length/ctl.length*100)}
    completeTask(t,sc,{grammar:sc});G.stage='done';runGrammar(t)}};
}

/* ---- listening ---- */
async function runListening(t){
  const tp=taskTopic(t);
  const c=await ensureContent(t,async()=>{
    const r=await ai(`${ctx()}\nWrite a realistic ${(tp.phase||0)>=2?'workplace':'everyday'} dialogue for listening practice on the topic "${tp.name}", using ${tp.grammar}. Two speakers with names, 8-12 short lines, natural spoken English at the learner's level.

    if(!r||!Array.isArray(r.lines)||!Array.isArray(r.questions))throw{code:'invalid_json'};r.questions=r.questions.filter(q=>q.o&&q.o.includes(q.a));return r;
  });

   ${L.done?`<div class="panel stack-s"><span class="eyebrow">Transcript</span>${c.lines.map(l=>`<div><strong>${esc(l.name||l.s)}:</strong> ${esc(l.t)}</div>`).join('')}</div>
     <div class="stack-s"><span class="eyebrow">Useful phrases</span><ul class="fb-list">${(c.phrases||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:`<div class="row"><button class="btn primary big" id="ls-check">Check answers</button></div>`}
   ${L.done?`<div class="row between"><span class="score" style="font-size:1.3rem">${t.score}/100</span><button class="btn primary big" id="tk-home">Back to today's plan</button></div>`:''}</div>`);
  $('#ls-play').onclick=()=>{L.plays++;$('#ls-play').disabled=true;sayLines(c.lines.map(l=>({s:l.s,t:l.t})),rate,()=>{const b=$('#ls-play');if(b){b.disabled=L.plays>=3;b.textContent=`Play again (${3-L.plays} left)`}})};
  $('#ls-stop').onclick=()=>{speechSynthesis.cancel();const b=$('#ls-play');if(b)b.disabled=L.plays>=3};

  const r=await ai(`${ctx()}\nYou are an experienced English speaking examiner. Evaluate this ${m.mode==='spoken'?'spoken answer (speech-to-text transcript; ignore punctuation and capitalisation)':'typed answer to a speaking task (the learner typed what they would say; do NOT score fluency or pronunciation)'}.
Question: "${question}"
Answer: "${text}"
Delivery data: ${m.words} words${m.wpm?', '+m.wpm+' words per minute':''}, ${m.fillersPer100} filler words per 100 words.
Score each 0-100 against a CEFR-referenced scale where 50 = A2, 65 = B1, 80 = B1+/B2-, 90 = B2, 95+ = C1. Be honest and consistent: do not inflate. Never comment on personality, emotions or confidence as a person; only on the language.
JSON: {"scores":{"grammar":0,"vocabulary":0,"coherence":0,"naturalness":0,"professional":0,"task":0${m.mode==='spoken'?',"fluency":0':''}},"overall":0,"strengths":["max 3, each quoting evidence"],"improvements":["max 3, most important first"],"errors":[{"original":"exact phrase from the answer","corrected":"","explanation":"one sentence","pattern":"snake_case grammar point","category":"grammar|vocabulary|word_order|register"}],"better_version":"the learner's answer rewritten at one level higher, same meaning, natural","retry_tip":"one sentence on what to change in the next attempt"} ${STYLE}`);
  if(!r||!r.scores)throw{code:'invalid_json'};
  if(r.overall==null)r.overall=avg(Object.values(r.scores));
  r.overall=clamp(Math.round(r.overall),0,100);r.delivery=m;return r;
}
async function runSpeaking(t){
  const tp=taskTopic(t);
  const c=await ensureContent(t,async()=>{
    const r=await ai(`${ctx()}\nCreate one speaking task for the topic "${tp.name}" that makes the learner use ${tp.grammar}. ${(tp.phase||0)>=2?'Set it in a realistic workplace situation for their target job.':'Make it personal and everyday.'}${t.recovery?' This is a recovery session: make it slightly easier and very clear.':''}
JSON: {"prompt":"the question to answer out loud","guidance":["3 points to include"],"target":"the structure or phrases to try","useful":["4 useful phrases"],"seconds":${(tp.phase||0)>=4?90:60}} ${STYLE}`);
    if(!r||!r.prompt)throw{code:'invalid_json'};return r;
  });
  if(!c)return;
  RT.s=RT.s&&RT.s.id===t.id?RT.s:{id:t.id,attempts:[],busy:false};
  const Sx=RT.s,last=Sx.attempts[Sx.attempts.length-1];
  const needRetry=last&&last.overall<85&&Sx.attempts.length<2;
  const finished=t.status==='done';
  let html=`<div class="card stack"><h2 style="font-family:var(--f-body);font-weight:600">${esc(c.prompt)}</h2>
   <div class="grid2"><div class="panel stack-s"><span class="eyebrow">Include</span><ul class="fb-list">${(c.guidance||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>
   <div class="panel stack-s"><span class="eyebrow">Try to use</span><span>${esc(c.target||'')}</span><ul class="fb-list">${(c.useful||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div></div></div>`;
  Sx.attempts.forEach((a,i)=>{html+=speakResult(a,i,Sx.attempts[i-1])});
  if(Sx.busy)html+=`<div class="card loading"><span class="spinner"></span> Your coach is listening to your answer…</div>`;
  else if(!finished&&(!last||needRetry)){
    html+=`<div class="card stack"><span class="eyebrow">${last?'Attempt 2 — use the feedback':'Your answer'} · aim for ${c.seconds||60} seconds</span>${speakBox('sp')}
      <div class="row">${last?'<button class="btn ghost" id="sp-keep">Keep first score</button>':''}<button class="btn primary big" id="sp-send">Get feedback</button></div></div>`;
  }else html+=doneCard(t,Sx.attempts.length>1?`<p>Attempt 1: ${Sx.attempts[0].overall} → Attempt 2: ${Sx.attempts[1].overall} (${Sx.attempts[1].overall-Sx.attempts[0].overall>=0?'+':''}${Sx.attempts[1].overall-Sx.attempts[0].overall}).</p>`:'');
  body(html);wireDone(t);
  const holder={};if($('#sp-txt'))wireSpeak('sp',holder);
  const finalize=()=>{const best=Sx.attempts[Sx.attempts.length-1];
    const tp2=taskTopic(t);if(!t.adhoc&&!tp2.weekly)pushCtx(topicState(tp2.id).spo,best.scores.grammar);
    const sk={speaking:best.overall};if(phaseOf(S.day)>=2&&best.scores.professional!=null)sk.professional=best.scores.professional;
    S.stats.speaking++;completeTask(t,best.overall,sk);runSpeaking(t)};
  const keep=$('#sp-keep');if(keep)keep.onclick=finalize;
  const send=$('#sp-send');if(send)send.onclick=async()=>{
    holder.rec&&holder.rec.stop();const txt=$('#sp-txt').value.trim();
    if(words(txt)<20){alertInline('#sp-send','Say a little more — at least 20 words.');return}
    const m=deliveryMetrics(txt,holder.rec?holder.rec.dur:0,holder.rec?holder.rec.mode:'typed');
    Sx.busy=true;runSpeaking(t);
    try{const r=await evalSpeaking(c.prompt,txt,m);r.text=txt;Sx.attempts.push(r);(r.errors||[]).forEach(e=>addError(e,'speaking'));
      if(Sx.attempts.length===2&&r.overall>Sx.attempts[0].overall&&S.today)S.today.corrected=(S.today.corrected||0)+1;
      Sx.busy=false;if(r.overall>=85||Sx.attempts.length>=2)finalize();else runSpeaking(t)}
    catch(e){Sx.busy=false;await runSpeaking(t);alertInline('#sp-send',aiErr(e))}
  };
}
function speakResult(a,i,prev){
  const sc=a.scores,rows=[['Grammar',sc.grammar],['Vocabulary',sc.vocabulary],['Fluency',sc.fluency],['Structure',sc.coherence],['Naturalness',sc.naturalness],['Professional',sc.professional],['Task',sc.task]];
  return `<div class="card stack"><div class="row between"><span class="eyebrow">Speaking result · attempt ${i+1}</span><span class="score" style="font-size:1.4rem">${a.overall}/100${prev?` <span class="small ${a.overall>=prev.overall?'':'muted'}">(${a.overall-prev.overall>=0?'+':''}${a.overall-prev.overall})</span>`:''}</span></div>
   <div class="bars">${rows.map(([n,v])=>scoreBar(n,v)).join('')}${scoreBar('Pronunciation',null,'Not measured')}</div>
   <p class="small muted">Delivery: ${a.delivery.words} words${a.delivery.wpm?' · '+a.delivery.wpm+' words/min':''} · ${a.delivery.fillersPer100} fillers per 100 words (aim for under 4)${a.delivery.mode==='typed'?' · typed practice, fluency not measured':''}</p>
   ${fbLists(a.strengths,a.improvements)}
   ${(a.errors||[]).length?`<div class="stack-s"><span class="eyebrow">Corrections</span>${a.errors.slice(0,5).map(e=>`<div class="corr"><span class="from">${esc(e.original)}</span><span class="to">${esc(e.corrected)}</span><span class="small muted">${esc(e.explanation)}</span></div>`).join('')}</div>`:''}
   ${a.better_version?`<div class="panel stack-s"><span class="eyebrow">A stronger version</span><p>${esc(a.better_version)}</p>${TTS?`<div><button class="btn ghost" onclick="say(this.closest('.panel').querySelector('p').textContent,{rate:.95})">Listen</button></div>`:''}</div>`:''}
   ${a.overall<85&&i===0?`<p><strong>Next:</strong> ${esc(a.retry_tip||'Try again using the corrections above.')}</p>`:''}</div>`;
}
function scoreBar(n,v,alt){return `<div class="bar"><span>${n}</span><div class="track"><div class="fill ${v==null?'':v<55?'lo':v<70?'mid':''}" style="width:${v==null?0:clamp(v,0,100)}%"></div></div><span class="mono small">${v==null?(alt?'—':'—'):Math.round(v)}</span></div>`}
function fbLists(st,im){return `<div class="grid2"><div class="stack-s"><span class="eyebrow">What worked</span><ul class="fb-list">${(st||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div><div class="stack-s"><span class="eyebrow">What to improve</span><ul class="fb-list">${(im||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div></div>`}

async function evalWriting(task,text,placement){
  const r=await ai(`${ctx()}\nYou are an experienced English writing examiner and workplace communication trainer. Evaluate this text.
Task: "${task}"
Text: """${text}"""
Score each 0-100 against a CEFR-referenced scale where 50 = A2, 65 = B1, 80 = B1+/B2-, 90 = B2, 95+ = C1. Be honest and consistent: do not inflate.
JSON: {"scores":{"grammar":0,"vocabulary":0,"spelling":0,"clarity":0,"structure":0,"tone":0,"professionalism":0,"task":0},"overall":0,"strengths":["max 3, each quoting evidence"],"improvements":["max 3, most important first"],"corrections":[{"original":"exact phrase","corrected":"","explanation":"one sentence","pattern":"snake_case grammar point","category":"grammar|vocabulary|spelling|register|structure"}],"model_answer":"a corrected, natural version of the learner's text at one level higher, keeping their ideas","retry_instruction":"one sentence telling the learner what to change in the rewrite"} ${STYLE}`);

   ${r.model_answer?`<details class="panel"><summary style="cursor:pointer;font-weight:600">Show a corrected version</summary><p style="white-space:pre-line;margin-top:8px">${esc(r.model_answer)}</p></details>`:''}</div>`;

async function runWriting(t){
  const tp=taskTopic(t),p=tp.phase||0;
  const kind=t.kind||(p>=3?'email or report':p>=2?'workplace message or email':'short personal text');
  const c=await ensureContent(t,async()=>{
    const r=await ai(`${ctx()}\nCreate one writing task (${kind}) for the topic "${tp.name}" that requires ${tp.grammar}. ${p>=3||t.kind?'Use a realistic workplace scenario for the learner\'s target job. For reports use the structure: Situation, Facts, Action, Result, Next step.':''}${t.recovery?' This is a recovery session: keep it short and clear.':''}

  const W=RT.w,last=W.attempts[W.attempts.length-1],needRetry=last&&last.overall<85&&W.attempts.length<2,finished=t.status==='done';

   <div class="panel stack-s"><span class="eyebrow">Useful phrases</span><ul class="fb-list">${(c.useful||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div>`;
  W.attempts.forEach((a,i)=>{html+=feedbackBlock(a,'Writing result · attempt '+(i+1),W.attempts[i-1])});
  if(W.busy)html+=`<div class="card loading"><span class="spinner"></span> Your coach is reading…</div>`;
  else if(!finished&&(!last||needRetry)){
    html+=`<div class="card stack"><span class="eyebrow">${last?'Rewrite — '+esc(last.retry_instruction||'use the corrections above'):'Your answer'}</span>
     <textarea id="wr-txt" placeholder="Write here…">${esc(W.draft||(last?last.text:''))}</textarea>
     <div class="row between"><span class="small muted" id="wr-wc"></span><div class="row">${last?'<button class="btn ghost" id="wr-keep">Keep first score</button>':''}<button class="btn primary big" id="wr-send">Get feedback</button></div></div></div>`;
  }else html+=doneCard(t,W.attempts.length>1?`<p>First draft ${W.attempts[0].overall} → rewrite ${W.attempts[1].overall} (${W.attempts[1].overall-W.attempts[0].overall>=0?'+':''}${W.attempts[1].overall-W.attempts[0].overall}).</p>`:'');

  const finalize=()=>{const b=W.attempts[W.attempts.length-1];const tp2=taskTopic(t);if(!t.adhoc&&!tp2.weekly)pushCtx(topicState(tp2.id).wri,b.scores.grammar);
    const sk={writing:b.overall};if(p>=2||t.kind)sk.professional=avg([b.scores.professionalism,b.scores.tone]);if(p>=3||t.kind==='professional email')S.emailDone=true;S.stats.writing++;completeTask(t,b.overall,sk);runWriting(t)};

  };

/* ---- conversation / roleplay ---- */
const PERSONAS=[['friend','A friendly neighbour'],['colleague','A new colleague'],['manager','Your manager'],['customer','A customer'],['hr','An HR officer'],['client','A client']];
async function runConversation(t){
  const tp=taskTopic(t),p=tp.phase||0;
  RT.c=RT.c&&RT.c.id===t.id?RT.c:{id:t.id,turns:t.turns||[],busy:false,eval:null};

  }

      <div class="bars">${[['Grammar',r.scores.grammar],['Vocabulary',r.scores.vocabulary],['Interaction',r.scores.interaction],['Naturalness',r.scores.naturalness],['Professional',r.scores.professional],['Task',r.scores.task]].map(([n,v])=>scoreBar(n,v)).join('')}</div>
      ${fbLists(r.strengths,r.improvements)}
      ${(r.errors||[]).length?`<div class="stack-s"><span class="eyebrow">Corrections</span>${r.errors.slice(0,6).map(e=>`<div class="corr"><span class="from">${esc(e.original)}</span><span class="to">${esc(e.corrected)}</span><span class="small muted">${esc(e.explanation)}</span></div>`).join('')}</div>`:''}
      ${(r.phrases||[]).length?`<div class="panel stack-s"><span class="eyebrow">Phrases to use next time</span><ul class="fb-list">${r.phrases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>${doneCard(t)}`);wireDone(t);return;
  }
  body(`<div class="card stack"><div class="row between"><span class="eyebrow">You are talking to ${esc(sc.label.toLowerCase())}${sc.work?' · Work mode':''}</span><span class="small muted mono">${learnerTurns}/6 replies</span></div>
   <div class="chat" id="cv-chat">${C.turns.map(x=>`<div class="msg ${x.role==='user'?'me':'ai'}">${esc(x.content)}</div>`).join('')}${C.busy?'<div class="msg ai"><span class="spinner"></span></div>':''}</div>
   ${speakBox('cv')}
   <div class="row between"><button class="btn ${canEnd?'':'ghost'}" id="cv-end" ${canEnd?'':'disabled'}>Finish and get feedback</button><button class="btn primary big" id="cv-send" ${C.busy?'disabled':''}>Send</button></div>

   ${canEnd?'':'<p class="small muted">Reply at least 6 times (60+ words in total) to finish. Your coach gives feedback at the end, not during the chat.</p>'}</div>`);

function runReview(t){

    const voc=vocabDue().slice(0,t.adhoc?0:8).map(v=>({kind:'voc',word:v.word}));
    t.items=shuffle(errs.concat(voc));t.res=[];t.i=0;
  }
  if(!t.items.length){body(`<div class="card stack"><p>Nothing is due for review right now.</p><div class="row"><button class="btn primary" id="rv-done">Continue</button></div></div>`);
    $('#rv-done').onclick=()=>{completeTask(t,100,{});go(t.adhoc?'errors':'home')};return}
  if(t.i>=t.items.length){

      let ok=norm(v)===norm(e.corrected);

        try{const j=await ai(`Original sentence with a mistake: "${e.original}". One correct version: "${e.corrected}". Learner's version: "${v}". Is the learner's version correct, natural English that fixes the mistake? JSON {"correct":true|false,"note":"one short sentence"}`,{tier:'quick'});ok=!!(j&&j.correct);it.note=j&&j.note}catch(er){}}
      if(ok){e.correctRuns=(e.correctRuns||0)+1;e.due=S.day+[2,4,7,14][Math.min(e.correctRuns-1,3)];e.status=e.correctRuns>=4&&S.day-e.lastDay>=7?'resolved':e.correctRuns>=2?'improving':e.status;if(S.today&&!t.adhoc)S.today.corrected++}
      else{e.correctRuns=0;e.count++;e.lastDay=S.day;e.due=S.day+1;if(e.count>=3)e.status='recurring'}
      t.res.push(ok?100:0);save();
      $('#rv-fb').innerHTML=`<div class="stack-s" style="margin-top:6px">${ok?'<strong style="color:var(--good)">Correct.</strong>':''}<div class="corr"><span class="to">${esc(e.corrected)}</span><span class="small muted">${esc(it.note||e.explain||'')}</span></div><div class="row"><button class="btn primary" id="rv-next">Next</button></div></div>`;
      $('#rv-next').onclick=()=>{t.i++;runReview(t)}};
  }else{

    body(`<div class="card stack"><span class="eyebrow">Word review · ${t.i+1} of ${t.items.length}</span>
     <div class="panel stack-s" style="text-align:center;padding:28px"><strong style="font-size:1.5rem">${esc(v.word)}</strong><span class="muted small">Say the meaning to yourself, then reveal.</span></div>
     <div id="rv-back" hidden class="stack-s"><span>${esc(v.meaning)}</span><em class="muted">${esc(v.example)}</em></div>

function finishDay(){
  const T=S.today,d=S.day,done=T.tasks.filter(x=>x.status==='done');
  const per={};done.forEach(x=>{for(const k in (x.skills||{})){const v=x.skills[k];if(v!=null&&!isNaN(v))(per[k]=per[k]||[]).push(v)}});
  const day={};for(const k in per)day[k]=avg(per[k]);
  let tw=0,ts=0;for(const k in day){const w=WEIGHTS[k]||.05;tw+=w;ts+=w*day[k]}
  const overall=tw?ts/tw:avg(done.map(x=>x.score))||0;
  const before={};for(const k of SK)before[k]=skillVal(k);
  for(const k in day)updateSkill(k,day[k],d);
  const skillDec={};for(const k in day)skillDec[k]=decide(day[k]);
  let main=decide(overall);const tomorrow=[];let flag=null;
  const tp=T.topic,p=phaseOf(d);
  if(T.kind==='lesson'){
    const st=topicState(tp.id);st.days.push({d,score:Math.round(overall),method:T.method});
    const recent=st.days.slice(-3);
    if(recent.length===3&&recent.every(x=>x.score<70)&&main!=='CHANGE'){main='CHANGE';flag='You have found this topic hard for three sessions, so tomorrow teaches it a different way.'}
    if(main==='REPEAT'||main==='CHANGE'){st.repeats=(st.repeats||0)+1;
      if(st.repeats>2){main='PRACTICE';flag='You have worked on this topic several times. We will move on and come back to it next week.';st.revisit=d+7;S.phaseIdx[p]=(S.phaseIdx[p]||0)+1;st.repeats=0}
      else{if(main==='CHANGE')st.method=(st.method||0)+1;tomorrow.push(main==='CHANGE'?`Re-learn "${tp.name}" with a new method: ${METHODS[(st.method||0)%METHODS.length].name}`:`Repeat "${tp.name}" with new exercises`)}}
    else{S.phaseIdx[p]=(S.phaseIdx[p]||0)+1;st.repeats=0}
  }
  // skill-floor & sudden drop rules

  if(lowSkills.length)recovery=lowSkills[0][0];
  for(const k of SK){const b=before[k],a=skillVal(k);if(b!=null&&a!=null&&(b-a>=10||a<55)&&!recovery)recovery=k}
  if(recovery)tomorrow.unshift(`Recovery block: ${SKN[recovery]}`);
  const recurring=S.errors.filter(e=>e.status==='recurring'&&e.lastDay>=d-7);
  if(recurring.length)tomorrow.push(`Warm-up drill on ${recurring.length} recurring mistake${recurring.length>1?'s':''}`);
  const nextTopic=(()=>{const nd=d+1;if(nd>180)return null;const k=dayKind(nd);if(k!=='lesson')return k==='weekly'?'Weekly review':k==='final'?'Final assessment':'Monthly assessment';const pp=phaseOf(nd),i=S.phaseIdx[pp]||0;return PH[pp].topics[i%PH[pp].topics.length][1]})();
  const repeating=T.kind==='lesson'&&(main==='REPEAT'||main==='CHANGE');
  if(nextTopic&&!repeating)tomorrow.push((T.kind==='lesson'&&main==='ADVANCE'?'Next topic: ':'Next: ')+nextTopic);
  S.next={recovery};
  // improvements
  let bestK=null,bestD=-99;for(const k in day){const b=before[k];if(b!=null&&day[k]-b>bestD){bestD=day[k]-b;bestK=k}}
  const minutes=done.reduce((a,x)=>a+(x.minutes||0),0);
  const rec={day:d,date:todayStr(),kind:T.kind,topic:T.kind==='lesson'?tp.name:null,overall:Math.round(overall),per:Object.fromEntries(Object.entries(day).map(([k,v])=>[k,Math.round(v)])),decision:main,skillDec,flag,
    minutes,mistakes:T.mistakes||0,corrected:T.corrected||0,recurring:recurring.length,improved:bestK&&bestD>0?SKN[bestK]:null,weakness:recurring[0]?recurring[0].original+' → '+recurring[0].corrected:(topWeaknesses()[0]||null),tomorrow,method:T.method};
  S.days.push(rec);S.lastReport=rec;
  // streak
  const t=todayStr();if(S.streak.last!==t){const gap=S.streak.last?daysBetween(S.streak.last,t):99;S.streak.cur=gap===1?S.streak.cur+1:1;S.streak.last=t;S.streak.longest=Math.max(S.streak.longest,S.streak.cur)}
  if(T.kind==='weekly')S.weekly.push(weeklyReport(d));

  RT.report=rec;go('dayreport');
}
function weeklyReport(d){
  const w=S.days.filter(x=>x.day>d-7&&x.day<=d),pw=S.days.filter(x=>x.day>d-14&&x.day<=d-7);
  const sk=k=>avg(w.map(x=>x.per[k]).filter(v=>v!=null)),psk=k=>avg(pw.map(x=>x.per[k]).filter(v=>v!=null));
  const vals=SK.map(k=>[k,sk(k)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  const imp=SK.map(k=>[k,sk(k)!=null&&psk(k)!=null?sk(k)-psk(k):null]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  const err=S.errors.filter(e=>e.lastDay>d-7).sort((a,b)=>b.count-a.count)[0];
  const o=avg(w.map(x=>x.overall)),po=avg(pw.map(x=>x.overall));
  return{week:Math.ceil(d/7),day:d,overall:R(o),prev:R(po),strongest:vals[0]?SKN[vals[0][0]]:null,weakest:vals.length?SKN[vals[vals.length-1][0]]:null,improved:imp[0]&&imp[0][1]>0?SKN[imp[0][0]]:null,error:err?PATTERN_LABEL(err.pattern)||err.original:null,priority:[vals.length?SKN[vals[vals.length-1][0]]:null,err?PATTERN_LABEL(err.pattern):null].filter(Boolean).join(' + ')};
}

function lineChart(series,{h=220,min=0,max=100}={}){
  const all=series.flatMap(s=>s.pts);if(all.length<2)return `<p class="small muted">The chart appears after two data points.</p>`;
  const W=640,H=h,pl=34,pr=14,pt=12,pb=26,xs=all.map(p=>p.d),x0=Math.min(...xs),x1=Math.max(...xs)||1;
  const X=d=>pl+(x1===x0?0:(d-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v}</text>`});
  [65,85].forEach(v=>{g+=`<text x="${W-pr}" y="${Y(v)-3}" text-anchor="end" font-size="9" fill="var(--muted)">${v===65?'B1':'B2'}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1" opacity=".5"/>`});
  const cols=['var(--accent)','var(--gold)','var(--info)','var(--rep)'];
  series.forEach((s,i)=>{if(s.pts.length<1)return;const pts=s.pts.map(p=>`${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    if(i===0&&s.pts.length>1)g+=`<polygon points="${X(s.pts[0].d)},${Y(min)} ${pts} ${X(s.pts[s.pts.length-1].d)},${Y(min)}" fill="var(--accent)" opacity=".08"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${cols[i%4]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const l=s.pts[s.pts.length-1];g+=`<circle cx="${X(l.d)}" cy="${Y(l.v)}" r="4" fill="${cols[i%4]}"/>`});
  g+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">Day ${x0}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)">Day ${x1}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score chart">${g}</svg>${series.length>1?`<div class="row small">${series.map((s,i)=>`<span class="row" style="gap:6px"><span style="width:12px;height:3px;background:${cols[i%4]};display:inline-block;border-radius:2px"></span>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}

function ivRules(){const c=RT.iv.cfg,prev=S.interviews.flatMap(i=>i.retry||[]).slice(-3);
  return `${ctx()}\nYou are a realistic job interviewer in the UAE for the role "${c.role}" in ${c.ind}, at a ${c.co.toLowerCase()}. Candidate experience: ${c.exp}. Difficulty: ${c.dif}. Run a ${RT.iv.total}-question interview: start with a brief greeting and "tell me about yourself"; then mix general, behavioural (STAR), and role-specific questions, and one realistic curveball. Ask exactly ONE question per turn, react briefly and naturally to the previous answer (no feedback, no scores), and use a follow-up question when an answer is vague. ${prev.length?'Include one of these questions the candidate struggled with before: '+prev.join(' | ')+'.':''} Speak clearly at the candidate's level. Reply with only what the interviewer says.`}
async function ivAsk(){
  const I=RT.iv;I.busy=true;render();
  try{const conv=[{role:'user',content:ivRules()+'\nBegin the interview.'},...I.turns.flatMap((t,i)=>[t])];
    const fixed=conv[conv.length-1].role==='user'?conv:conv.concat([{role:'user',content:'(continue)'}]);
    const txt=await ai(fixed,{tier:'quick',json:false});I.turns.push({role:'assistant',content:txt.trim()});if(TTS)say(txt.trim(),{rate:.97,voice:1})}
  catch(e){I.err=aiErr(e);if(I.turns.length&&I.turns[I.turns.length-1].role==='user'){} }
  I.busy=false;render();if(I.err){alertInline('#iv-send',I.err);I.err=null}
}
async function ivScore(){
  const I=RT.iv;I.stage='scoring';render();
  const tr=I.turns.map(t=>(t.role==='user'?'CANDIDATE: ':'INTERVIEWER: ')+t.content).join('\n');
  try{const r=await ai(`${ctx()}\nScore this mock interview for "${I.cfg.role}" (${I.cfg.dif}). Evaluate only the CANDIDATE. Score 0-100, CEFR-referenced for language (65 = B1, 85 = B2) and realistic hiring standards for content. Honest, no inflation, no personality judgments.\n${tr}\nJSON: {"scores":{"relevance":0,"structure":0,"specificity":0,"grammar":0,"vocabulary":0,"professionalism":0,"delivery":0},"overall":0,"strong":["short descriptions of strong answers"],"weak":[{"question":"","why":"","better":"a stronger answer using the candidate's own facts"}],"retry_questions":["questions to practise again"],"errors":[{"original":"","corrected":"","explanation":"","pattern":"snake_case"}]} ${STYLE}`);
    if(!r||!r.scores)throw{code:'invalid_json'};if(r.overall==null)r.overall=avg(Object.values(r.scores));r.overall=clamp(Math.round(r.overall),0,100);
    I.result=r;I.stage='result';(r.errors||[]).forEach(e=>addError(e,'speaking'));
    S.interviews.push({date:todayStr(),day:S.day,role:I.cfg.role,overall:r.overall,scores:r.scores,retry:(r.retry_questions||[]).slice(0,4)});
    S.stats.interviews++;updateSkill('interview',r.overall,S.day);checkAchievements();save();pushCoach();
  }catch(e){I.stage='run';I.err=aiErr(e)}
  render();if(I.err){alertInline('#iv-send',I.err);I.err=null}
}

}
AFTER.settings=()=>{
  $('#st-form').onsubmit=e=>{e.preventDefault();Object.assign(S.profile,{name:$('#st-name').value.trim()||S.profile.name,lang:$('#st-lang').value.trim(),target:$('#st-target').value.trim(),job:$('#st-job').value.trim(),targetJob:$('#st-tjob').value.trim(),industry:$('#st-ind').value.trim(),goalLevel:$('#st-goal').value,minutes:+$('#st-min').value});save();pushCoach();$('#st-msg').textContent='Saved. Time changes apply from your next day.'};
  const ks=$('#st-keysave');if(ks){ks.onclick=()=>{const v=$('#st-key').value.trim();if(!v||v.startsWith('••')){$('#st-keymsg').textContent='Paste a key first.';return}try{localStorage.setItem('fluent180_key',v)}catch(e){}AIOK=true;render()};
    $('#st-keytest').onclick=async()=>{const m=$('#st-keymsg');m.textContent='Testing…';try{await ai('Reply with the single word OK.',{tier:'quick',json:false});m.textContent='Key works.';m.style.color='var(--good)'}catch(e){m.textContent=aiErr(e);m.style.color='var(--bad)'}};
    const kd=$('#st-keydel');if(kd)kd.onclick=()=>{try{localStorage.removeItem('fluent180_key')}catch(e){}AIOK=false;render()}}
  $('#st-share').onclick=()=>{if(!DB||!UID)return;S.share=!S.share;save();pushCoach();render()};
  const ex=$('#st-export');if(ex)ex.onclick=async()=>{const data=JSON.stringify(S,null,2);
    if(DL){try{await DL.save({filename:'fluent180-progress.json',data})}catch(e){}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='fluent180-progress.json';document.body.appendChild(a);a.click();a.remove()};
  $('#st-reset').onclick=()=>{$('#st-confirm').innerHTML=`<div class="banner row between"><span>This deletes all progress, scores and mistakes. It can't be undone.</span><div class="row"><button class="btn" id="rs-no">Cancel</button><button class="btn primary" id="rs-yes">Delete everything</button></div></div>`;
    $('#rs-no').onclick=()=>{$('#st-confirm').innerHTML=''};$('#rs-yes').onclick=()=>{const share=S.share;S=blank();if(share)pushCoach();doSave();RT={};go('onboard')}};
};

/* ================= coach view ================= */
function vCoach(){
  return `<div class="stack"><div class="stack-s"><span class="eyebrow">Coach view</span><h1>Learners who shared progress</h1><p class="muted">A summary only. Private writing, conversations and interview answers are never shown here.</p></div><div id="co-list"><div class="loading"><span class="spinner"></span> Loading…</div></div></div>`;
}
AFTER.coach=async()=>{
  const el=$('#co-list');
  if(!DB){el.innerHTML='<div class="card"><p class="muted">Coach view works when Fluent180 is opened inside Claude, where progress can be shared with another person. In this downloaded version, progress stays in this browser; use Download my data in Settings to share a backup.</p></div>';return}
  try{const snap=await DB.collection('coach').get();
    if(snap.empty){el.innerHTML='<div class="card"><p class="muted">No one has shared progress yet. A learner turns on sharing in Settings, then shares this page with you.</p></div>';return}
    let names={};if(USER&&USER.profiles){try{names=await USER.profiles(snap.docs.map(d=>d.id))}catch(e){}}
    el.innerHTML=`<div class="stack">${snap.docs.map(d=>{const x=d.data();const nm=(names[d.id]&&names[d.id].name)||x.name||'Learner';
      return `<div class="card stack"><div class="row between"><h2>${esc(nm)}</h2><span class="small muted">Updated ${new Date(x.updated).toLocaleDateString()}</span></div>
       <div class="grid3"><div class="stack-s"><span class="small muted">Day</span><strong class="mono">${x.day}/180</strong></div><div class="stack-s"><span class="small muted">Level (AI-estimated)</span><strong>${esc(x.level||'—')} → ${esc(x.target||'')}</strong></div><div class="stack-s"><span class="small muted">Streak</span><strong class="mono">${x.streak}</strong></div>
       <div class="stack-s"><span class="small muted">Weekly score</span><strong class="mono">${x.weekly??'—'}</strong></div><div class="stack-s"><span class="small muted">Speaking · Writing</span><strong class="mono">${x.speaking??'—'} · ${x.writing??'—'}</strong></div><div class="stack-s"><span class="small muted">Best interview</span><strong class="mono">${x.interviewBest??'—'}</strong></div></div>
       <div class="stack-s"><span class="small muted">Current focus</span><span>${esc(x.phase||'')} · ${esc(x.focus||'')}</span></div>
       <div class="stack-s"><span class="small muted">Main weaknesses</span><div class="row">${(x.weaknesses||[]).map(w=>`<span class="tag rep">${esc(w)}</span>`).join('')}</div></div>
       ${x.lastDecision?`<span class="small">Last decision: <strong>${esc(x.lastDecision)}</strong></span>`:''}</div>`}).join('')}</div>`;
  }catch(e){el.innerHTML='<div class="card"><p class="muted">Shared progress could not be loaded. Reload the page to try again.</p></div>'}
};

/* ================= after 180 ================= */
function vAfter180(){
  return `<div class="stack"><div class="stack-s"><span class="eyebrow">Program complete</span><h1>You finished 180 days</h1><p class="muted">Your final assessment is in Progress. Choose how to continue.</p></div>
  <div class="grid2">${[['maint','Maintenance',30,'Keep your level with 30 minutes a day'],['master','Professional mastery',90,'Deeper workplace and presentation work'],['iv','Interview sprint',60,'Daily interview practice for your job search'],['adv','Advanced (B2 → C1)',60,'Harder topics and faster conversations']].map(([k,n,m,d])=>`<button class="opt stack-s" data-mode="${k}" data-min="${m}"><strong>${n}</strong><span class="small muted">${d} · ${m} min/day</span></button>`).join('')}</div></div>`;
}
AFTER.home=(orig=>()=>{if(S.day>180&&!S.mode){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.profile.minutes=+b.dataset.min;S.mode=b.dataset.mode;save();go(b.dataset.mode==='iv'?'interview':'home')});return}orig()})(AFTER.home);

window.addEventListener('pagehide',()=>{if(S)doSave()});
boot();
</script>

</body>
</html>
